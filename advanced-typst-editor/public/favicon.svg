<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Typst Studio">
  <!-- Typst Studio: a page under edit. Near-black tile matches the app's dark
       canvas; the caret is the signature red. Keep this comment free of double
       hyphens (CSS variable names) - they are illegal inside an XML comment and
       make the whole file unparseable, so the favicon silently fails to render. -->
  <rect width="32" height="32" rx="7" fill="#141414"/>
  <rect x=".6" y=".6" width="30.8" height="30.8" rx="6.4" fill="none" stroke="#3a3a3a" stroke-width="1.2"/>
  <rect x="7" y="5.5" width="18" height="21" rx="2.2" fill="#f2f2f2"/>
  <g stroke="#9b9b9b" stroke-width="2.2" stroke-linecap="round">
    <path d="M10.5 11h11"/>
    <path d="M10.5 16h11"/>
    <path d="M10.5 21h7"/>
  </g>
  <path d="M16 8.6v14.8" stroke="#ef4444" stroke-width="2.6" stroke-linecap="round"/>
</svg>
