<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="BenchMate">
  <!-- BenchMate: a friendly face made of breadboard parts on the violet
       tile. Two holes are the eyes and a jumper wire, both ends seated in
       holes, is the smile. The same mark is inlined in client/styles.css;
       keep the two in step. No double hyphens in this comment: they are
       illegal inside an XML comment. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#5a2fc2"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="8" fill="url(#g)"/>
  <g fill="#fff" fill-opacity=".3">
    <circle cx="6" cy="6" r="1.2"/><circle cx="16" cy="6" r="1.2"/><circle cx="26" cy="6" r="1.2"/>
  </g>
  <circle cx="11" cy="12.5" r="2.4" fill="#fff"/>
  <circle cx="21" cy="12.5" r="2.4" fill="#fff"/>
  <path d="M8.5 19C10 25.5 22 25.5 23.5 19" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/>
  <circle cx="8.5" cy="19" r="2.3" fill="#fff"/>
  <circle cx="23.5" cy="19" r="2.3" fill="#fff"/>
</svg>
