<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Chemistry Tool</title>
    <meta name="description" content="Type a chemical name or formula and see its 2D structure and interactive 3D model." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='10' cy='20' r='7' fill='%23ff3b3b'/%3E%3Ccircle cx='22' cy='12' r='7' fill='%23e6e6e6' stroke='%23444' stroke-width='1'/%3E%3C/svg%3E" />
  </head>
  <body>
    <div id="app">
      <header class="top">
        <a class="brand" href="./" data-nav="home"><span class="brand-dot"></span>Chemistry Tool</a>
        <form class="search" id="search-form" autocomplete="off" role="search">
          <input id="search-input" type="search" placeholder="Name, formula, CAS or SMILES: water, CH3COOH, caffeine, Ca(OH)2, c1ccccc1" aria-label="Chemical to look up" spellcheck="false" />
          <button type="submit">Look up</button>
          <ul id="suggestions" class="suggestions" hidden></ul>
        </form>
        <nav class="nav">
          <a href="?view=browse" data-nav="browse">Browse</a>
          <a href="?view=connect" data-nav="connect">Connect</a>
        </nav>
      </header>
      <main id="main"></main>
      <footer class="foot">
        Structures: local library plus <a href="https://pubchem.ncbi.nlm.nih.gov/" rel="noopener" target="_blank">PubChem</a>. Depictions by OpenChemLib, 3D by 3Dmol.js.
        <a href="/openapi.json" target="_blank">API</a>
      </footer>
    </div>
    <script type="module" src="/src/client/main.ts"></script>
  </body>
</html>
